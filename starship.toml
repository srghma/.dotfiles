"$schema" = 'https://starship.rs/config-schema.json'

format = """
$directory\
[](fg:#fc86ca bg:#ffff93)\
$git_branch\
$git_status\
$docker_context\
[ ](fg:#ffff93)\
"""

# Disable the blank line at the start of the prompt
add_newline = false

[character]
error_symbol = "[❯](bold #ff5555) "

[username]
show_always = true
style_user = "fg:#000000 bg:#bd93f9"
style_root = "fg:#000000 bg:#bd93f9"
format = '[$user ]($style)'
disabled = false

[os]
style = "fg:#000000 bg:#bd93f9"
disabled = true

[directory]
style = "fg:#000000 bg:#fc86ca"
format = "[ $path ]($style)"
truncation_length = 3

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "fg:#000000 bg:#ffff93"
format = '[ $symbol $branch ]($style)'

[git_status]
# style = "fg:#000000 bg:#ffff93"
# format = '[$all_status$ahead_behind ]($style)'

conflicted = '🏳'
ahead = '🏎💨'
behind = '😰'
diverged = '😵'
up_to_date = '✓'
untracked = '🤷'
stashed = '📦'
modified = '📝'
staged = '[++\($count\)](green)'
renamed = '👅'
deleted = '🗑'

[docker_context]
symbol = " "
style = "fg:#000000 bg:#ffff93"
format = '[ $symbol $context ]($style)'

