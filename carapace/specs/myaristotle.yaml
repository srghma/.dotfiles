name: myaristotle
description: myaristotle - Aristotle task watcher, puller, and queue runner
commands:
- name: watch_branches
  aliases:
  - watch_and_pull
  description: Watch projects and sync tasks
  flags:
    --config=: ''
    -c=: ''
    --queue-dir=: ''
    -q=: ''
    --interval=: ''
    -i=: ''
    --branch=: ''
    -b=: ''
    --backlog-dir=: ''
    -k=: ''
- name: last_3_tasks_my_prompts_and_its_end_message
  description: Display status and last 3 prompts with responses
  flags:
    --config=: ''
    -c=: ''
  completion:
    positional:
    - []
- name: pull_force
  description: Force pull results for target project
  flags:
    --config=: ''
    -c=: ''
  completion:
    positional:
    - []
    - []
- name: task_to_git_message
  description: Generate or commit git message for task
  flags:
    --task-id=: ''
    -t=: ''
    --latest: ''
    --commit: ''
    --no-push: ''
    --config=: ''
    -c=: ''
  completion:
    positional:
    - []
- name: queue
  description: Manage project queues and backlogs
  commands:
  - name: list
    aliases:
    - ls
    description: List all project queues
    flags:
      --config=: ''
      -c=: ''
  - name: show
    description: Show queued messages for project
    flags:
      --config=: ''
      -c=: ''
    completion:
      positional:
      - []
  - name: pop
    description: Pop and archive next message
    flags:
      --config=: ''
      -c=: ''
    completion:
      positional:
      - []
  - name: clean-backlog
    aliases:
    - dedup-backlog
    description: Deduplicate existing backlog files
    flags:
      --config=: ''
      -c=: ''
      --all: ''
      -a: ''
- name: open_pwd_in_browser
  description: Open Aristotle project URL in Google Chrome with the matching account
    profile
  flags:
    --config=: ''
    -c=: ''
  completion:
    positional:
    - []
- name: formalize
  aliases:
  - submit
  description: Submit directory to Aristotle and add to config
  flags:
    --prompt=: ''
    -p=: ''
    --account=: ''
    -a=: ''
    --pull=: ''
    --branch=: ''
    -b=: ''
    --config=: ''
    -c=: ''
    --queue-dir=: ''
    -q=: ''
  completion:
    flag:
      pull:
      - only_pull
      - pull_and_commit
      - pull_and_commit_and_push
    positional:
    - []
- name: completions
  description: Generate shell completions
  commands:
  - name: carapace
    description: Print Carapace completion spec
  - name: install-carapace
    description: Generate and install Carapace completion spec
