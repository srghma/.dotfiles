# Schema for TOML validation

#:schema https://yazi-rs.github.io/schemas/keymap.json

[mgr]

prepend_keymap = [
  { on = [
    "g",
    ".",
  ], run = "cd ~/.dotfiles", desc = "Go to dotfiles" },
  { on = [
    "g",
    "p",
  ], run = "cd ~/projects", desc = "Go to projects" },
  { on = [
    "g",
    "d",
    "w",
  ], run = "cd ~/Downloads", desc = "Go to Downloads" },
  { on = [
    "g",
    "d",
    "c",
  ], run = "cd ~/Documents", desc = "Go to Documents" },
  { on = "l", run = "plugin open-or-enter", desc = "Enter directory or open file" },
  { on = "E", run = '''shell --block "nvim \"$@\""''', desc = "Open in Neovim" },
]
